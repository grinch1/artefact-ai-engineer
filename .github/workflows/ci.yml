name: CI
on:
  push:
  pull_request:
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python -m compileall -q agent.py api.py offline.py store.py
      - run: python -m unittest discover -s tests -v
      - run: docker build -t emporio-agent:ci .
